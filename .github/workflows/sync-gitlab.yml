name: Sync to GitLab

on:
  push:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate GitLab configuration
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN is not configured."
            exit 1
          fi

      - name: Push to GitLab
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY: tools.ages.pucrs.br/2026-2/2jk-4jk/recorda/frontend.git
        run: git push "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPOSITORY}" "HEAD:refs/heads/${GITHUB_REF_NAME}"
